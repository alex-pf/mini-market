<line x1="420" y1="844" x2="748" y2="844" stroke="#ddd"/>

<rect x="420" y="858" width="328" height="68" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
<text x="440" y="878" font-size="20">🛒</text>
