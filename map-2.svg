<text x="440" y="916" font-size="10.5" fill="#888">Построй тележку из Лего, поставь перед собой</text>

<rect x="420" y="938" width="328" height="68" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
<text x="440" y="958" font-size="20">🏪</text>
<text x="470" y="958" font-size="13" font-weight="bold" fill="#9a6000">Лавка в городе — 8$</text>
<text x="440" y="978" font-size="11.5" fill="#555">+2$ пассивного дохода каждый раунд</text>
<text x="440" y="996" font-size="10.5" fill="#888">Построй лавку, поставь на карту в свой город</text>

<rect x="420" y="1018" width="328" height="68" rx="8" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
<text x="440" y="1038" font-size="20">⚡</text>
<text x="470" y="1038" font-size="13" font-weight="bold" fill="#9a6000">Быстрый маршрут — 8$</text>
<text x="440" y="1058" font-size="11.5" fill="#555">Один переезд между 2 городами = 0 ходов</text>
<text x="440" y="1076" font-size="10.5" fill="#888">Построй дорогу из Лего между двумя городами</text>

<text x="584" y="1108" text-anchor="middle" font-size="10.5" fill="#aaa">Апгрейды можно купить в любой момент своего хода</text>

</svg>
