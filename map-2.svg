<text x="60" y="964" font-size="12" fill="#8e44ad">⚓ Продать в Торговый порт</text>
<text x="364" y="964" text-anchor="end" font-size="13" font-weight="bold" fill="#8e44ad">3$</text>
<line x1="46" y1="974" x2="374" y2="974" stroke="#eee"/>

<text x="60" y="996" font-size="12" fill="#c0392b">⚡ Продать в другой город</text>
<text x="364" y="996" text-anchor="end" font-size="13" font-weight="bold" fill="#c0392b">2$</text>
<line x1="46" y1="1006" x2="374" y2="1006" stroke="#eee"/>

<text x="60" y="1028" font-size="12" fill="#333">Стартовый капитал (каждый)</text>
<text x="364" y="1028" text-anchor="end" font-size="13" font-weight="bold" fill="#333">6$</text>
<line x1="46" y1="1038" x2="374" y2="1038" stroke="#eee"/>

<text x="60" y="1060" font-size="12" fill="#e74c3c" font-weight="bold">🏆 Победа — 30$, доигрывается раунд</text>
<text x="364" y="1060" text-anchor="end" font-size="13" font-weight="bold" fill="#e74c3c">→ у кого больше</text>
<line x1="46" y1="1070" x2="374" y2="1070" stroke="#eee"/>

<text x="60" y="1092" font-size="11" fill="#888">Рюкзак: максимум 3 товара одновременно</text>

