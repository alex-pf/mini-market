<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" font-family="Georgia, serif">

<!-- HEADER -->
<rect width="794" height="45" fill="#2c3e50"/>
<text x="397" y="29" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🏝️ ТОРГОВЫЕ МАРШРУТЫ · Карта острова · Лист 2 из 2 (восточная часть)</text>
<rect y="45" width="794" height="3" fill="#e74c3c"/>

<!-- MAP (nested SVG, viewBox = правая половина острова) -->
<svg x="0" y="48" width="794" height="757" viewBox="800 0 840 800" preserveAspectRatio="xMinYMin meet">

  <!-- Ocean -->
  <rect x="800" width="840" height="800" fill="#a8d8ea"/>

  <!-- Waves -->
  <g opacity="0.22" stroke="#5ba4c7" stroke-width="2.5" fill="none">
    <path d="M1470,80 Q1500,68 1530,80 Q1560,92 1590,80"/>
    <path d="M1470,102 Q1500,90 1530,102 Q1560,114 1590,102"/>
    <path d="M1480,560 Q1510,548 1540,560 Q1570,572 1600,560"/>
    <path d="M1480,582 Q1510,570 1540,582 Q1570,594 1600,582"/>
  </g>

  <!-- Fish -->
  <g fill="#4a8ab0" opacity="0.4">
    <ellipse cx="1540" cy="230" rx="18" ry="9"/><polygon points="1558,230 1570,222 1570,238"/>
    <ellipse cx="1520" cy="480" rx="14" ry="7"/><polygon points="1534,480 1543,474 1543,486"/>
  </g>

  <!-- Island (полный контур — SVG обрежет по viewBox) -->
  <path d="M200,720 Q110,640 90,500 Q70,360 130,230 Q190,110 340,65 Q500,20 680,18 Q870,16 1060,50 Q1250,84 1390,175 Q1530,266 1540,415 Q1550,560 1470,648 Q1375,735 1165,762 Q945,790 735,782 Q525,774 375,752 Q278,737 200,720 Z" fill="#c8d97a" stroke="#8aaa3a" stroke-width="5"/>

  <!-- Terrain -->
  <ellipse cx="700" cy="390" rx="230" ry="155" fill="#b5cc6a" opacity="0.32"/>
  <ellipse cx="975" cy="345" rx="150" ry="92" fill="#9db85a" opacity="0.2"/>

  <!-- Beach highlights -->
  <ellipse cx="975" cy="714" rx="92" ry="26" fill="#f0e6c0" opacity="0.5"/>
  <ellipse cx="1227" cy="324" rx="56" ry="22" fill="#f0e6c0" opacity="0.5"/>

  <!-- Port decoration -->
  <text x="1460" y="180" font-size="36" opacity="0.25">⚓</text>
  <text x="1480" y="620" font-size="28" opacity="0.2">🌊</text>

  <!-- ROADS -->
  <g stroke="#c8a96e" stroke-width="8" fill="none" stroke-dasharray="18,8" opacity="0.8" stroke-linecap="round">
    <path d="M500,145 Q602,272 705,398"/>
    <path d="M500,145 Q365,307 230,470"/>
    <path d="M500,145 Q862,222 1225,300"/>
    <path d="M705,398 Q468,434 230,470"/>
    <path d="M705,398 Q965,349 1225,300"/>
    <path d="M705,398 Q840,543 975,688"/>
    <path d="M230,470 Q303,567 375,640"/>
    <path d="M375,640 Q675,682 975,688"/>
    <path d="M1225,300 Q1100,494 975,688"/>
  </g>

  <!-- Подписи дорог, входящих с левого листа -->
  <rect x="803" y="196" width="148" height="22" rx="5" fill="white" opacity="0.82"/>
  <text x="808" y="212" font-size="11" fill="#1a5276">← Рыбацкая деревня</text>

  <rect x="803" y="366" width="106" height="22" rx="5" fill="white" opacity="0.82"/>
  <text x="808" y="382" font-size="11" fill="#922b21">← Столица</text>

  <rect x="803" y="488" width="106" height="22" rx="5" fill="white" opacity="0.82"/>
  <text x="808" y="504" font-size="11" fill="#922b21">← Столица</text>

  <!-- CITY: Рыбацкая деревня (500,145) — частично видна, без label -->
  <g transform="translate(500,145)">
    <circle r="46" fill="#2980b9" stroke="white" stroke-width="4.5"/>
    <text y="-1" text-anchor="middle" font-size="28">🐟</text>
    <text y="18" text-anchor="middle" font-size="11" fill="white" font-weight="bold">РЫБ.</text>
  </g>

  <!-- CITY: Столица (705,398) — частично видна -->
  <g transform="translate(705,398)">
    <circle r="54" fill="#c0392b" stroke="white" stroke-width="5"/>
    <text y="-5" text-anchor="middle" font-size="32">🏛</text>
    <text y="18" text-anchor="middle" font-size="12" fill="white" font-weight="bold">СТОЛИЦА</text>
  </g>

  <!-- CITY: Торговый порт (1225,300) -->
  <g transform="translate(1225,300)">
    <circle r="44" fill="#8e44ad" stroke="white" stroke-width="4.5"/>
    <text y="-1" text-anchor="middle" font-size="26">⚓</text>
    <text y="17" text-anchor="middle" font-size="11" fill="white" font-weight="bold">ПОРТ</text>
    <rect x="-80" y="55" width="160" height="46" rx="9" fill="white" opacity="0.92"/>
    <text y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#6c3483">Торговый</text>
    <text y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#6c3483">порт</text>
    <rect x="-80" y="106" width="160" height="21" rx="4" fill="#e8daef" opacity="0.95"/>
    <text y="121" text-anchor="middle" font-size="10.5" fill="#6c3483">⚓ перекупщик: всё по 3$</text>
    <rect x="-80" y="130" width="160" height="21" rx="4" fill="#e8daef" opacity="0.9"/>
    <text y="145" text-anchor="middle" font-size="10" fill="#6c3483">купит и продаст что угодно</text>
  </g>

  <!-- CITY: Фермы (375,640) — частично видна -->
  <g transform="translate(375,640)">
    <circle r="44" fill="#d35400" stroke="white" stroke-width="4.5"/>
    <text y="-1" text-anchor="middle" font-size="26">🌾</text>
    <text y="17" text-anchor="middle" font-size="11" fill="white" font-weight="bold">ФЕРМА</text>
  </g>

  <!-- CITY: Курортный город (975,688) -->
  <g transform="translate(975,688)">
    <circle r="44" fill="#f39c12" stroke="white" stroke-width="4.5"/>
    <text y="-1" text-anchor="middle" font-size="26">🏖</text>
    <text y="17" text-anchor="middle" font-size="11" fill="white" font-weight="bold">КУРОРТ</text>
    <rect x="-84" y="-130" width="168" height="42" rx="9" fill="white" opacity="0.92"/>
    <text y="-111" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6000">Курортный</text>
    <text y="-94" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6000">город</text>
    <rect x="-84" y="-83" width="168" height="21" rx="4" fill="#fef9e7" opacity="0.95"/>
    <text y="-68" text-anchor="middle" font-size="10.5" fill="#9a6000">↓ продаёт: 🍦 мороженое · 🍎 яблоки</text>
    <rect x="-84" y="-59" width="168" height="21" rx="4" fill="#fdebd0" opacity="0.95"/>
    <text y="-44" text-anchor="middle" font-size="10.5" fill="#a04000">★ хочет: 🐟 рыба · 🌭 хотдоги</text>
  </g>

  <!-- Линия стыка (левый край листа 2) -->
  <line x1="814" y1="0" x2="814" y2="800" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="14,7" opacity="0.75"/>
  <text font-size="13" fill="#e74c3c" opacity="0.85" transform="translate(820,420) rotate(90)">← стыковать с листом 1  ✂</text>

</svg>

<!-- ТАБЛИЦА ЦЕН И АПГРЕЙДЫ -->
<rect y="806" width="794" height="2" fill="#ddd"/>

<!-- Цены -->
<rect x="30" y="814" width="360" height="290" rx="10" fill="#f8f9fa" stroke="#ddd" stroke-width="1.5"/>
<text x="210" y="836" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">💰 Таблица цен</text>
