<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Georgia, serif">

  <!-- Ocean background -->
  <rect width="800" height="600" fill="#a8d8ea"/>

  <!-- Ocean waves decoration -->
  <g opacity="0.3" stroke="#5ba4c7" stroke-width="1.5" fill="none">
    <path d="M20,80 Q50,70 80,80 Q110,90 140,80"/>
    <path d="M600,50 Q630,40 660,50 Q690,60 720,50"/>
    <path d="M680,520 Q710,510 740,520 Q770,530 800,520"/>
    <path d="M10,480 Q40,470 70,480 Q100,490 130,480"/>
    <path d="M30,540 Q60,530 90,540 Q120,550 150,540"/>
    <path d="M650,560 Q680,550 710,560 Q740,570 770,560"/>
  </g>

  <!-- Compass rose -->
  <g transform="translate(720,100)">
    <circle cx="0" cy="0" r="28" fill="white" opacity="0.7" stroke="#c8a96e" stroke-width="1.5"/>
    <polygon points="0,-22 4,-8 -4,-8" fill="#c0392b"/>
    <polygon points="0,22 4,8 -4,8" fill="#7f8c8d"/>
    <polygon points="-22,0 -8,4 -8,-4" fill="#7f8c8d"/>
    <polygon points="22,0 8,4 8,-4" fill="#7f8c8d"/>
    <text x="0" y="-26" text-anchor="middle" font-size="9" font-weight="bold" fill="#c0392b">С</text>
    <text x="0" y="36" text-anchor="middle" font-size="9" fill="#555">Ю</text>
    <text x="-30" y="4" text-anchor="middle" font-size="9" fill="#555">З</text>
    <text x="30" y="4" text-anchor="middle" font-size="9" fill="#555">В</text>
    <circle cx="0" cy="0" r="4" fill="#c8a96e"/>
  </g>

  <!-- Island shape -->
  <path d="M200,480 Q140,440 120,370 Q100,290 130,220 Q160,150 220,110 Q290,65 380,55 Q470,45 540,80 Q610,115 650,175 Q690,240 685,320 Q678,400 640,450 Q590,500 510,520 Q430,540 350,535 Q270,528 200,480 Z"
        fill="#c8d97a" stroke="#8aaa3a" stroke-width="3"/>

  <!-- Island inner texture (hills/terrain) -->
  <ellipse cx="350" cy="280" rx="120" ry="80" fill="#b5cc6a" opacity="0.4"/>
  <ellipse cx="280" cy="220" rx="60" ry="40" fill="#9db85a" opacity="0.3"/>
  <ellipse cx="450" cy="200" rx="50" ry="35" fill="#9db85a" opacity="0.3"/>

  <!-- Forest decorations near Лесной городок -->
  <g fill="#4a8a3a" opacity="0.7">
    <polygon points="185,270 175,295 195,295"/>
    <polygon points="200,265 190,292 210,292"/>
    <polygon points="170,280 160,300 180,300"/>
    <polygon points="215,275 205,298 225,298"/>
  </g>

  <!-- Sea fish decorations -->
  <g fill="#5ba4c7" opacity="0.5">
    <ellipse cx="90" cy="200" rx="12" ry="6"/>
    <polygon points="102,200 110,194 110,206"/>
    <ellipse cx="700" cy="420" rx="12" ry="6"/>
    <polygon points="712,420 720,414 720,426"/>
    <ellipse cx="110" cy="430" rx="10" ry="5"/>
    <polygon points="120,430 127,425 127,435"/>
  </g>

  <!-- ROADS -->
  <g stroke="#c8a96e" stroke-width="5" fill="none" stroke-dasharray="12,5" opacity="0.85" stroke-linecap="round">
    <!-- Столица — Рыбацкая деревня -->
    <path d="M390,180 Q360,155 310,130"/>
    <!-- Столица — Лесной городок -->
    <path d="M370,200 Q290,210 240,250"/>
    <!-- Столица — Торговый порт -->
    <path d="M430,200 Q480,190 530,210"/>
    <!-- Столица — Курортный город -->
    <path d="M400,230 Q405,310 400,370"/>
    <!-- Лесной городок — Фермы -->
    <path d="M230,280 Q250,330 280,360"/>
    <!-- Фермы — Курортный город -->
    <path d="M320,390 Q360,400 390,390"/>
    <!-- Торговый порт — Курортный город -->
    <path d="M545,250 Q520,330 430,375"/>
    <!-- Рыбацкая деревня — Торговый порт -->
    <path d="M330,115 Q430,100 520,210"/>
  </g>

  <!-- CITY: Рыбацкая деревня (north coast) -->
  <g transform="translate(295,115)">
    <circle cx="0" cy="0" r="28" fill="#2980b9" stroke="white" stroke-width="3"/>
    <text x="0" y="-5" text-anchor="middle" font-size="20">🐟</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="white" font-weight="bold">РЫБ.</text>
    <rect x="-62" y="33" width="124" height="34" rx="6" fill="white" opacity="0.88"/>
    <text x="0" y="47" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5276">Рыбацкая</text>
    <text x="0" y="61" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5276">деревня</text>
    <rect x="-60" y="70" width="120" height="18" rx="4" fill="#d6eaf8" opacity="0.9"/>
    <text x="0" y="83" text-anchor="middle" font-size="9" fill="#1a5276">🐟 Рыба  🍣 Суши</text>
  </g>

  <!-- CITY: Столица (center) -->
  <g transform="translate(400,205)">
    <circle cx="0" cy="0" r="34" fill="#c0392b" stroke="white" stroke-width="3"/>
    <text x="0" y="-6" text-anchor="middle" font-size="22">🏛</text>
    <text x="0" y="12" text-anchor="middle" font-size="8" fill="white" font-weight="bold">СТОЛИЦА</text>
    <rect x="-55" y="38" width="110" height="34" rx="6" fill="white" opacity="0.88"/>
    <text x="0" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#922b21">Столица</text>
    <text x="0" y="65" text-anchor="middle" font-size="8.5" fill="#922b21">центральный рынок</text>
    <rect x="-55" y="76" width="110" height="18" rx="4" fill="#fadbd8" opacity="0.9"/>
    <text x="0" y="89" text-anchor="middle" font-size="9" fill="#922b21">🍕 Пицца  ☕ Кофе</text>
  </g>

  <!-- CITY: Лесной городок (west) -->
  <g transform="translate(220,268)">
    <circle cx="0" cy="0" r="26" fill="#27ae60" stroke="white" stroke-width="3"/>
    <text x="0" y="-4" text-anchor="middle" font-size="18">🌿</text>
    <text x="0" y="10" text-anchor="middle" font-size="7" fill="white" font-weight="bold">ЛЕС</text>
    <rect x="-58" y="32" width="116" height="34" rx="6" fill="white" opacity="0.88"/>
    <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d6a3a">Лесной</text>
    <text x="0" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d6a3a">городок</text>
    <rect x="-58" y="70" width="116" height="18" rx="4" fill="#d5f5e3" opacity="0.9"/>
    <text x="0" y="83" text-anchor="middle" font-size="9" fill="#1d6a3a">🍌 Банан  🍍 Ананас</text>
  </g>

  <!-- CITY: Торговый порт (east) -->
  <g transform="translate(548,228)">
    <circle cx="0" cy="0" r="26" fill="#8e44ad" stroke="white" stroke-width="3"/>
    <text x="0" y="-4" text-anchor="middle" font-size="18">⚓</text>
    <text x="0" y="10" text-anchor="middle" font-size="7" fill="white" font-weight="bold">ПОРТ</text>
    <rect x="-60" y="32" width="120" height="34" rx="6" fill="white" opacity="0.88"/>
    <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="bold" fill="#6c3483">Торговый</text>
    <text x="0" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#6c3483">порт</text>
    <rect x="-60" y="70" width="120" height="18" rx="4" fill="#e8daef" opacity="0.9"/>
    <text x="0" y="83" text-anchor="middle" font-size="9" fill="#6c3483">перекупщик всего</text>
  </g>

  <!-- CITY: Фермы (southwest) -->
  <g transform="translate(295,380)">
    <circle cx="0" cy="0" r="26" fill="#d35400" stroke="white" stroke-width="3"/>
    <text x="0" y="-4" text-anchor="middle" font-size="18">🌾</text>
    <text x="0" y="10" text-anchor="middle" font-size="7" fill="white" font-weight="bold">ФЕРМА</text>
    <rect x="-52" y="32" width="104" height="34" rx="6" fill="white" opacity="0.88"/>
    <text x="0" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04000">Фермы</text>
    <text x="0" y="65" text-anchor="middle" font-size="8.5" fill="#a04000"> </text>
    <rect x="-52" y="70" width="104" height="18" rx="4" fill="#fdebd0" opacity="0.9"/>
    <text x="0" y="83" text-anchor="middle" font-size="9" fill="#a04000">🦃 Индейка  🧀 Сыр</text>
  </g>

  <!-- CITY: Курортный город (south) -->
  <g transform="translate(413,385)">
    <circle cx="0" cy="0" r="26" fill="#f39c12" stroke="white" stroke-width="3"/>
    <text x="0" y="-4" text-anchor="middle" font-size="18">🏖</text>
    <text x="0" y="10" text-anchor="middle" font-size="7" fill="white" font-weight="bold">КУРОРТ</text>
    <rect x="-58" y="32" width="116" height="34" rx="6" fill="white" opacity="0.88"/>
    <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6000">Курортный</text>
    <text x="0" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6000">город</text>
    <rect x="-58" y="70" width="116" height="18" rx="4" fill="#fef9e7" opacity="0.9"/>
    <text x="0" y="83" text-anchor="middle" font-size="9" fill="#9a6000">🍦 Мороженое  🍰 Десерт</text>
  </g>

  <!-- LEGEND -->
  <rect x="18" y="490" width="220" height="98" rx="10" fill="white" opacity="0.85" stroke="#c8a96e" stroke-width="1.5"/>
  <text x="128" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">ЛЕГЕНДА</text>
  <line x1="30" y1="518" x2="65" y2="518" stroke="#c8a96e" stroke-width="4" stroke-dasharray="8,4"/>
  <text x="75" y="522" font-size="10" fill="#555">— торговый маршрут</text>
  <text x="30" y="540" font-size="10" fill="#555">💰 Стартовый капитал: 6$</text>
  <text x="30" y="556" font-size="10" fill="#555">🎒 Инвентарь: 3 товара</text>
  <text x="30" y="572" font-size="10" fill="#555">🏆 Победа при: 30$</text>

  <!-- PRICE TABLE -->
  <rect x="560" y="460" width="228" height="128" rx="10" fill="white" opacity="0.85" stroke="#c8a96e" stroke-width="1.5"/>
  <text x="674" y="478" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">ЦЕНЫ</text>
  <text x="575" y="496" font-size="10" fill="#555">💸 Купить товар:</text>
  <text x="774" y="496" text-anchor="end" font-size="10" font-weight="bold" fill="#c0392b">2$</text>
  <text x="575" y="514" font-size="10" fill="#555">✅ Продать (нужный город):</text>
  <text x="774" y="514" text-anchor="end" font-size="10" font-weight="bold" fill="#27ae60">5$</text>
  <text x="575" y="532" font-size="10" fill="#555">❌ Продать (другой город):</text>
  <text x="774" y="532" text-anchor="end" font-size="10" font-weight="bold" fill="#e67e22">1$</text>
  <text x="575" y="550" font-size="10" fill="#555">🛒 Апгрейд тележки:</text>
  <text x="774" y="550" text-anchor="end" font-size="10" font-weight="bold" fill="#8e44ad">5$</text>
  <text x="575" y="568" font-size="10" fill="#555">🏪 Открыть лавку:</text>
  <text x="774" y="568" text-anchor="end" font-size="10" font-weight="bold" fill="#8e44ad">10$</text>
  <text x="575" y="586" font-size="10" fill="#555">⚡ Быстрый маршрут:</text>
  <text x="774" y="586" text-anchor="end" font-size="10" font-weight="bold" fill="#8e44ad">8$</text>

  <!-- Title -->
  <rect x="240" y="12" width="320" height="38" rx="10" fill="white" opacity="0.85" stroke="#c8a96e" stroke-width="2"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#8B4513">🏝 Торговые маршруты 🏝</text>

</svg>
